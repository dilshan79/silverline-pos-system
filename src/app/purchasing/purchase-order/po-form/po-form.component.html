<div class="dlg-backdrop" *ngIf="visible" (click)="cancelled.emit()">
  <div class="dlg-box card" (click)="$event.stopPropagation()">
    <h3>Create Purchase Order</h3>
    <div class="fg">
      <label>
        Supplier
        <input type="text" [(ngModel)]="supplier" placeholder="Supplier Name" />
      </label>
    </div>
    <div style="margin-top: 12px;">
      <h4>Order Items</h4>
      <div *ngFor="let item of items; let i = index" class="fg" style="margin-bottom: 8px;">
        <label>Item Code <input type="text" [(ngModel)]="item.code" /></label>
        <label>Qty <input type="number" [(ngModel)]="item.qty" /></label>
        <label>Cost <input type="number" [(ngModel)]="item.cost" /></label>
      </div>
      <button class="btn alt" (click)="addItem()">+ Add Item Line</button>
    </div>
    <div class="dlg-actions">
      <button class="btn alt" (click)="cancelled.emit()">Cancel</button>
      <button class="btn" (click)="save()">Submit PO</button>
    </div>
  </div>
</div>
